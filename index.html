<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft Music Box</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .sound-item {
            cursor: pointer;
            padding: 8px 12px;
            line-height: 1.8;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .sound-item:hover {
            background-color: #e5e7eb;
        }

        .sound-item.selected {
            background-color: #bfdbfe;
        }

        .sound-item.match {
            background-color: #fefcbf;
        }

        .sound-item::before {
            content: '🎵 ';
            font-size: 1.2rem;
        }

        .sidebar {
            width: 320px;
            overflow-y: auto;
            height: calc(100vh - 2rem);
            scrollbar-width: thin;
            scrollbar-color: #9ca3af #f3f4f6;
        }

        .sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #f3f4f6;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 4px;
        }

        .search-input {
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #d1d5db;
            border-radius: 6px;
        }

        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            outline: none;
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltip-text {
            visibility: hidden;
            width: 300px;
            background-color: #1f2937;
            color: #fff;
            text-align: left;
            padding: 8px;
            border-radius: 6px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            margin-left: -150px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>


<body class="bg-gray-100 font-sans">

    <div class="flex">

        <!-- ==================== Sidebar ==================== -->

        <div
            id="sidebar"
            class="sidebar bg-white p-4 rounded-r-lg shadow-lg"
        >

            <h2 class="text-xl font-semibold mb-4 text-gray-800">
                Sound List
            </h2>


            <div class="flex flex-col gap-3 mb-4">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search sound ID or path..."
                    class="search-input w-full"
                >


                <select
                    id="categorySelect"
                    class="p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500"
                >
                    <option value="">All Categories</option>
                </select>

            </div>


            <div
                id="soundList"
                class="text-gray-700"
            ></div>

        </div>


        <!-- ==================== Main Content ==================== -->

        <div class="flex-1 p-4">

            <h1 class="text-3xl font-bold text-center mb-4 text-blue-600">
                Minecraft Music Box (Bedrock Edition)
            </h1>


            <div class="bg-white p-4 rounded-lg shadow-lg">

                <h2 class="text-xl font-semibold mb-2 text-gray-800">
                    Playback & Command Generator
                </h2>


                <!-- Audio Player -->

                <audio
                    id="audioPlayer"
                    controls
                    class="w-full mb-4 rounded-md"
                ></audio>


                <div
                    id="currentSound"
                    class="text-gray-600 mb-2 font-medium"
                >
                    No sound selected
                </div>


                <div class="grid grid-cols-1 gap-4 mb-4">

                    <!-- ==================== Volume ==================== -->

                    <div>

                        <label class="block text-sm font-medium text-gray-700">

                            Volume (0.0 - 100.0, Default: 1.0)

                            <span class="tooltip">

                                <span class="text-gray-500 text-xs ml-1">
                                    ⓘ
                                </span>

                                <span class="tooltip-text">
                                    Used for Minecraft Bedrock Edition commands
                                    to control sound volume and audible range.
                                    A value of 1.0 provides an audible radius
                                    of approximately 16 blocks.
                                    This does not affect browser playback and
                                    is only used for command generation.
                                </span>

                            </span>

                        </label>


                        <input
                            id="volume"
                            type="number"
                            step="0.1"
                            min="0"
                            max="100"
                            value="1.0"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                        >

                    </div>


                    <!-- ==================== Pitch ==================== -->

                    <div>

                        <label class="block text-sm font-medium text-gray-700">

                            Pitch (0.5 - 2.0, Default: 1.0)

                            <span class="tooltip">

                                <span class="text-gray-500 text-xs ml-1">
                                    ⓘ
                                </span>

                                <span class="tooltip-text">
                                    Controls the pitch and playback speed of
                                    the sound. A value of 2.0 plays at double
                                    speed. This is the only setting that affects
                                    browser audio playback.
                                </span>

                            </span>

                        </label>


                        <input
                            id="pitch"
                            type="number"
                            step="0.1"
                            min="0.5"
                            max="2.0"
                            value="1.0"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                        >

                    </div>


                    <!-- ==================== Minimum Volume ==================== -->

                    <div>

                        <label class="block text-sm font-medium text-gray-700">

                            Minimum Volume (0.0 - 1.0, Default: 0.0)

                            <span class="tooltip">

                                <span class="text-gray-500 text-xs ml-1">
                                    ⓘ
                                </span>

                                <span class="tooltip-text">
                                    Used for Minecraft Bedrock Edition commands
                                    to control the volume outside the normal
                                    audible range. A value of 0.0 means no sound
                                    outside the range. This does not affect
                                    browser playback.
                                </span>

                            </span>

                        </label>


                        <input
                            id="minVolume"
                            type="number"
                            step="0.1"
                            min="0"
                            max="1"
                            value="0.0"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                        >

                    </div>


                    <!-- ==================== Auto Replay ==================== -->

                    <div>

                        <label class="flex items-center text-sm font-medium text-gray-700">

                            <input
                                id="autoReplay"
                                type="checkbox"
                                class="mr-2 h-4 w-4 text-blue-500 focus:ring-blue-500 border-gray-300 rounded"
                            >

                            Auto Replay Sound

                            <span class="tooltip">

                                <span class="text-gray-500 text-xs ml-1">
                                    ⓘ
                                </span>

                                <span class="tooltip-text">
                                    When enabled, changing the volume, pitch,
                                    or minimum volume will automatically replay
                                    the current sound. Disabled by default.
                                </span>

                            </span>

                        </label>

                    </div>

                </div>


                <!-- ==================== Command ==================== -->

                <div class="mb-4">

                    <label class="block text-sm font-medium text-gray-700">
                        Generated Command
                    </label>


                    <div
                        id="command"
                        class="bg-gray-100 p-2 rounded-md text-gray-800 font-mono break-all"
                    >
                        /playsound
                    </div>

                </div>


                <!-- ==================== Copy Button ==================== -->

                <button
                    id="copyButton"
                    class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition"
                >
                    Copy Command
                </button>

            </div>

        </div>

    </div>


    <!-- ==================== JavaScript ==================== -->

    <script>

        let allSounds = [];
        let categories = new Set();
        let currentSound = null;


        /*
         * ============================================================
         * Normalize Audio Path
         * ============================================================
         *
         * This fixes paths such as:
         *
         * xiaojiuaini.github.io/minecraft-music-box/sounds/...
         *
         * and:
         *
         * https://xiaojiuaini.github.io/minecraft-music-box/sounds/...
         *
         * into:
         *
         * sounds/...
         *
         * so GitHub Pages can correctly resolve:
         *
         * https://xiaojiuaini.github.io/minecraft-music-box/sounds/...
         */

        function normalizeAudioPath(path) {

            if (!path) {
                return "";
            }


            let audioPath = String(path).trim();


            // Remove leading "./"

            audioPath =
                audioPath.replace(
                    /^\.\/+/,
                    ""
                );


            // Remove full GitHub Pages URL

            audioPath =
                audioPath.replace(
                    /^https?:\/\/xiaojiuaini\.github\.io\/minecraft-music-box\//i,
                    ""
                );


            // Remove GitHub Pages domain without protocol

            audioPath =
                audioPath.replace(
                    /^xiaojiuaini\.github\.io\/minecraft-music-box\//i,
                    ""
                );


            // Remove duplicated repository path

            audioPath =
                audioPath.replace(
                    /^\/?minecraft-music-box\//i,
                    ""
                );


            // Remove leading slash

            audioPath =
                audioPath.replace(
                    /^\/+/,
                    ""
                );


            return audioPath;

        }


        /*
         * ============================================================
         * Get Final Audio URL
         * ============================================================
         */

        function getAudioUrl(path) {

            const normalizedPath =
                normalizeAudioPath(path);


            if (!normalizedPath) {
                return "";
            }


            /*
             * Use relative path.
             *
             * Current GitHub Pages:
             *
             * https://xiaojiuaini.github.io/minecraft-music-box/
             *
             * Therefore:
             *
             * ./sounds/example.ogg
             *
             * becomes:
             *
             * https://xiaojiuaini.github.io/minecraft-music-box/sounds/example.ogg
             */

            return `./${normalizedPath}`;

        }


        /*
         * ============================================================
         * Load sounds.json
         * ============================================================
         */

        async function fetchSoundFiles() {

            try {

                const response =
                    await fetch(
                        "./sounds.json",
                        {
                            cache: "no-cache"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP Error! Status: ${response.status}`
                    );

                }


                const soundFiles =
                    await response.json();


                if (!Array.isArray(soundFiles)) {

                    throw new Error(
                        "sounds.json does not contain an array."
                    );

                }


                allSounds =
                    soundFiles;


                console.log(
                    `Loaded ${allSounds.length} sounds.`
                );


                renderSoundList(
                    allSounds
                );


                populateCategories();


            } catch (error) {

                console.error(
                    "Unable to load sound definitions:",
                    error
                );


                document
                    .getElementById("soundList")
                    .innerHTML =
                    `
                    <p class="text-red-500">
                        Failed to load sounds.
                    </p>
                    <p class="text-sm text-gray-500 mt-2">
                        Please check sounds.json.
                    </p>
                    `;

            }

        }


        /*
         * ============================================================
         * Render Sound List
         * ============================================================
         */

        function renderSoundList(sounds) {

            const soundList =
                document.getElementById(
                    "soundList"
                );


            soundList.innerHTML = "";


            if (
                !Array.isArray(sounds)
                ||
                sounds.length === 0
            ) {

                soundList.innerHTML =
                    `
                    <p class="text-red-500">
                        No sound files found.
                    </p>
                    `;

                return;

            }


            const ul =
                document.createElement("ul");


            soundList.appendChild(
                ul
            );


            sounds.forEach(
                sound => {

                    const li =
                        createSoundListItem(
                            sound
                        );


                    ul.appendChild(
                        li
                    );

                }
            );

        }


        /*
         * ============================================================
         * Create Sound List Item
         * ============================================================
         */

        function createSoundListItem(
            sound,
            match = false
        ) {

            const li =
                document.createElement("li");


            li.className =
                match
                    ? "sound-item match"
                    : "sound-item";


            li.innerHTML =
                `
                ${escapeHtml(
                    sound.name || "Unknown Sound"
                )}

                <span class="text-xs text-gray-500">
                    (${escapeHtml(
                        sound.category ||
                        "Uncategorized"
                    )})
                </span>
                `;


            li.dataset.paths =
                JSON.stringify(
                    sound.paths || []
                );


            li.dataset.name =
                sound.name || "";


            li.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    document
                        .querySelectorAll(
                            ".sound-item"
                        )
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "selected"
                                )
                        );


                    li.classList.add(
                        "selected"
                    );


                    currentSound =
                        sound;


                    playSound(
                        sound
                    );

                }
            );


            return li;

        }


        /*
         * ============================================================
         * Escape HTML
         * ============================================================
         */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /*
         * ============================================================
         * Render Filtered Sound List
         * ============================================================
         */

        function renderSoundListWithMatches(
            filteredSounds
        ) {

            const soundList =
                document.getElementById(
                    "soundList"
                );


            soundList.innerHTML = "";


            if (
                !Array.isArray(filteredSounds)
                ||
                filteredSounds.length === 0
            ) {

                soundList.innerHTML =
                    `
                    <p class="text-red-500">
                        No matching sounds found.
                    </p>
                    `;

                return;

            }


            const ul =
                document.createElement("ul");


            soundList.appendChild(
                ul
            );


            filteredSounds.forEach(
                sound => {

                    ul.appendChild(
                        createSoundListItem(
                            sound,
                            true
                        )
                    );

                }
            );

        }


        /*
         * ============================================================
         * Populate Categories
         * ============================================================
         */

        function populateCategories() {

            const select =
                document.getElementById(
                    "categorySelect"
                );


            categories.clear();


            /*
             * Remove old options except
             * "All Categories"
             */

            select.innerHTML =
                `
                <option value="">
                    All Categories
                </option>
                `;


            allSounds.forEach(
                sound => {

                    if (
                        sound.category
                    ) {

                        categories.add(
                            sound.category
                        );

                    }

                }
            );


            /*
             * Sort categories
             */

            const sortedCategories =
                Array.from(
                    categories
                ).sort();


            sortedCategories.forEach(
                category => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        category;


                    option.textContent =
                        category;


                    select.appendChild(
                        option
                    );

                }
            );

        }


        /*
         * ============================================================
         * Filter Sounds
         * ============================================================
         *
         * IMPORTANT:
         *
         * Original code had:
         *
         * return
         *     matchesSearch
         *     &&
         *     matchesCategory;
         *
         * JavaScript interprets that as:
         *
         * return;
         *
         * The condition MUST be on the same line.
         */

        function filterSounds() {

            const searchTerm =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const category =
                document
                    .getElementById(
                        "categorySelect"
                    )
                    .value;


            const filteredSounds =
                allSounds.filter(
                    sound => {

                        const name =
                            String(
                                sound.name || ""
                            )
                            .toLowerCase();


                        const paths =
                            Array.isArray(
                                sound.paths
                            )
                                ? sound.paths
                                : [];


                        const matchesSearch =
                            name.includes(
                                searchTerm
                            )
                            ||
                            paths.some(
                                path =>
                                    String(path)
                                        .toLowerCase()
                                        .includes(
                                            searchTerm
                                        )
                            );


                        const matchesCategory =
                            !category
                            ||
                            sound.category === category;


                        /*
                         * IMPORTANT:
                         * Keep return on the same line.
                         */

                        return matchesSearch && matchesCategory;

                    }
                );


            renderSoundListWithMatches(
                filteredSounds
            );

        }


        /*
         * ============================================================
         * Play Sound
         * ============================================================
         */

        function playSound(sound) {

            const audioPlayer =
                document.getElementById(
                    "audioPlayer"
                );


            const currentSoundDisplay =
                document.getElementById(
                    "currentSound"
                );


            if (
                !sound
                ||
                !Array.isArray(sound.paths)
                ||
                sound.paths.length === 0
            ) {

                console.error(
                    "Sound has no audio paths:",
                    sound
                );


                alert(
                    "This sound does not have a valid audio file."
                );


                return;

            }


            const pitch =
                parseFloat(
                    document
                        .getElementById(
                            "pitch"
                        )
                        .value
                )
                || 1.0;


            const paths =
                sound.paths;


            /*
             * Randomly select one audio file
             * from the sound definition.
             */

            const randomPath =
                paths[
                    Math.floor(
                        Math.random()
                        *
                        paths.length
                    )
                ];


            /*
             * Convert the path into a correct
             * GitHub Pages relative URL.
             */

            const audioUrl =
                getAudioUrl(
                    randomPath
                );


            if (!audioUrl) {

                console.error(
                    "Invalid audio path:",
                    randomPath
                );


                alert(
                    "Invalid audio file path."
                );


                return;

            }


            console.log(
                "Original audio path:",
                randomPath
            );


            console.log(
                "Final audio URL:",
                audioUrl
            );


            /*
             * Stop current audio.
             */

            audioPlayer.pause();


            audioPlayer.currentTime =
                0;


            /*
             * Remove previous handlers.
             */

            audioPlayer.oncanplay = null;
            audioPlayer.onerror = null;


            /*
             * Set new audio source.
             */

            audioPlayer.src =
                audioUrl;


            /*
             * Browser playback volume.
             *
             * Minecraft command volume is
             * handled separately.
             */

            audioPlayer.volume =
                1.0;


            /*
             * Pitch / playback speed.
             */

            audioPlayer.playbackRate =
                Math.max(
                    0.5,
                    Math.min(
                        2.0,
                        pitch
                    )
                );


            /*
             * Audio loaded successfully.
             */

            audioPlayer.oncanplay = () => {

                audioPlayer
                    .play()
                    .catch(
                        error => {

                            if (
                                error.name !==
                                "AbortError"
                            ) {

                                console.error(
                                    "Audio playback failed:",
                                    error
                                );

                            }

                        }
                    );

            };


            /*
             * Audio loading error.
             */

            audioPlayer.onerror = () => {

                console.error(
                    "Audio failed to load."
                );


                console.error(
                    "Original path:",
                    randomPath
                );


                console.error(
                    "Final URL:",
                    audioPlayer.src
                );


                alert(
                    "Unable to load audio.\n\n" +
                    "URL:\n" +
                    audioPlayer.src
                );

            };


            /*
             * Force browser to load the new file.
             */

            audioPlayer.load();


            /*
             * Update UI.
             */

            currentSoundDisplay.textContent =
                `Current Sound: ${sound.name}`;


            /*
             * Update Minecraft command.
             */

            updateCommand(
                sound.name
            );

        }


        /*
         * ============================================================
         * Update Minecraft Command
         * ============================================================
         */

        function updateCommand(
            soundName
        ) {

            const volume =
                parseFloat(
                    document
                        .getElementById(
                            "volume"
                        )
                        .value
                )
                || 1.0;


            const pitch =
                parseFloat(
                    document
                        .getElementById(
                            "pitch"
                        )
                        .value
                )
                || 1.0;


            const minVolume =
                parseFloat(
                    document
                        .getElementById(
                            "minVolume"
                        )
                        .value
                )
                || 0.0;


            const command =
                `/playsound ${soundName} @s ~ ~ ~ ${volume.toFixed(1)} ${pitch.toFixed(1)} ${minVolume.toFixed(1)}`;


            document
                .getElementById(
                    "command"
                )
                .textContent =
                command;

        }


        /*
         * ============================================================
         * Validate Input
         * ============================================================
         */

        function validateInput(
            input,
            min,
            max,
            defaultValue
        ) {

            input.addEventListener(
                "input",
                () => {

                    let value =
                        parseFloat(
                            input.value
                        );


                    if (
                        isNaN(value)
                        ||
                        value < min
                    ) {

                        value =
                            defaultValue;


                        input.value =
                            defaultValue;

                    }


                    if (
                        value > max
                    ) {

                        value =
                            max;


                        input.value =
                            max;

                    }


                    if (
                        currentSound
                    ) {

                        updateCommand(
                            currentSound.name
                        );


                        const autoReplay =
                            document
                                .getElementById(
                                    "autoReplay"
                                )
                                .checked;


                        if (
                            autoReplay
                        ) {

                            playSound(
                                currentSound
                            );

                        }

                    }

                }
            );

        }


        /*
         * ============================================================
         * Copy Command
         * ============================================================
         */

        document
            .getElementById(
                "copyButton"
            )
            .addEventListener(
                "click",
                async () => {

                    const command =
                        document
                            .getElementById(
                                "command"
                            )
                            .textContent;


                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                command
                            );


                        alert(
                            "Command copied to clipboard!"
                        );


                    } catch (
                        error
                    ) {

                        console.error(
                            "Copy failed:",
                            error
                        );


                        alert(
                            "Copy failed. Please copy the command manually."
                        );

                    }

                }
            );


        /*
         * ============================================================
         * Initialize
         * ============================================================
         */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                /*
                 * Load sound definitions.
                 */

                fetchSoundFiles();


                /*
                 * Input validation.
                 */

                validateInput(
                    document.getElementById(
                        "volume"
                    ),
                    0,
                    100,
                    1.0
                );


                validateInput(
                    document.getElementById(
                        "pitch"
                    ),
                    0.5,
                    2.0,
                    1.0
                );


                validateInput(
                    document.getElementById(
                        "minVolume"
                    ),
                    0,
                    1,
                    0.0
                );


                /*
                 * Search.
                 */

                document
                    .getElementById(
                        "searchInput"
                    )
                    .addEventListener(
                        "input",
                        filterSounds
                    );


                /*
                 * Category filter.
                 */

                document
                    .getElementById(
                        "categorySelect"
                    )
                    .addEventListener(
                        "change",
                        filterSounds
                    );

            }
        );

    </script>

</body>
</html>
